name = "ral-finance-daily-brief"
main = "src/index.js"
compatibility_date = "2026-05-09"

[triggers]
# 05:00 UTC = 08:00 Asia/Bahrain (UTC+3, no DST). Sends the daily brief + next-day payment reminders.
crons = ["0 5 * * *"]

[vars]
# Public, non-secret config.
APP_ORIGIN = "https://finance.raltech.dev"
# RAL Finance API on the VPS (all data, snapshots, restore codes and email quota go through it).
FINANCE_API_URL = "https://finance-api.raltech.dev"
MAIL_FROM = "RAL Finance <reminders@mail.raltech.dev>"
MAIL_TO = "revenueautomationlab@gmail.com"
MAIL_CC = "saeedalsaeedbusiness@gmail.com,suhaibrajabo@gmail.com"

# Secrets (set with `wrangler secret put <NAME>` — never commit these):
#   RESEND_API_KEY             — Resend API key
#   FINANCE_API_TOKEN          : service JWT for GET /state (HS256 with the API JWT_SECRET, email = owner, svc = true)
#   TRIGGER_TOKEN              — guards the manual /preview + /send fetch endpoint
